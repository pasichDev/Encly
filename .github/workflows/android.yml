name: Android CI

# Docs-only changes don't build. Store texts (fastlane/) are NOT ignored: StoreMetadataTest
# checks them. A change that also touches anything else runs CI as usual.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# Only the newest run per branch / PR matters; cancel superseded ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Dependabot bumps (build(deps) / ci(deps)) don't run CI on their own PR: they are merged in
    # batches and checked on the branch that takes them, or on main after the merge.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write   # only for the coverage comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # One Gradle invocation, fdroid flavor only, to keep Actions minutes low. The play flavor
      # differs only in store flags and is built by the release workflow; instrumented tests
      # (Room migrations, SQLCipher) run locally on an emulator: see CONTRIBUTING.md.
      - name: Format, unit tests, detekt, release build
        run: >-
          ./gradlew spotlessCheck
          :app:testFdroidDebugUnitTest
          :app:koverXmlReportFdroidDebug
          :app:koverVerifyFdroidDebug
          :app:detekt
          :app:assembleFdroidRelease

      # Separate invocation: lint running alongside Metro code generation for another variant has
      # raced on generated sources; after the build it reads finished outputs.
      - name: Lint (release)
        run: ./gradlew :app:lintFdroidRelease

      - name: Check merged manifest has no INTERNET permission
        run: |
          set -euo pipefail
          # AGP has used both directory names; a check that finds no manifest must fail, not pass.
          manifests=$(find app/build/intermediates/merged_manifest app/build/intermediates/merged_manifests \
            -name AndroidManifest.xml -path '*fdroidRelease*' 2>/dev/null || true)
          if [ -z "$manifests" ]; then
            echo "::error::No merged fdroidRelease manifest found to check"
            exit 1
          fi
          found=0
          for m in $manifests; do
            echo "Checking $m"
            if grep -q 'android.permission.INTERNET' "$m"; then
              echo "::error file=$m::INTERNET permission found in merged release manifest"
              found=1
            fi
          done
          exit $found

      # For information only: posts (and keeps updating) one PR comment with the app
      # coverage. It never fails the build.
      - name: Coverage comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: app/build/reports/kover/reportFdroidDebug.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 'Coverage'
          update-comment: true
          min-coverage-overall: 0
          min-coverage-changed-files: 0

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
