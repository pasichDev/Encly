# Flatpak manifest for the Encly desktop app. Built by build.sh in this directory (and by the `desktop-package`
# job in .github/workflows/android.yml), not by hand: it expects the staged app image in ../../build/flatpak.
#
# The app is the jpackage app image that `:desktopApp:createDistributable` produces: the same launcher, JVM
# arguments, module list and bundled Java runtime as the .deb. The Platform runtime supplies the C libraries
# (X11, fontconfig, freetype, GL); the SDK is needed only by flatpak-builder itself.
app-id: io.github.pasichdev.Encly
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: encly

finish-args:
  # No --share=network: the app makes no network connection (PRIVACY.md, desktopApp/README.md).
  # No --filesystem: files are picked through the FileChooser portal (the app already uses it on Linux) and
  # reach the sandbox through the document portal, also the ones a file manager opens with %f.
  #
  # Display. The bundled Java runtime draws through X11 only (AWT has no Wayland backend), so on a Wayland
  # session it runs through XWayland. `fallback-x11` would withhold X11 there and the app would not start.
  - --socket=x11
  - --share=ipc
  # Skiko (Compose's renderer) draws with OpenGL.
  - --device=dri
  # The device-bound half of the PIN key, in the Secret Service (:core:keystore).
  - --talk-name=org.freedesktop.secrets
  # Lock when the session locks: the screen savers' ActiveChanged signal on the session bus ...
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.ScreenSaver
  - --talk-name=org.cinnamon.ScreenSaver
  - --talk-name=org.mate.ScreenSaver
  # ... and logind's Lock, Unlock and PrepareForSleep on the system bus. Without these the app still runs but
  # never locks on a locked session or on suspend.
  - --system-talk-name=org.freedesktop.login1

modules:
  - name: encly
    buildsystem: simple
    build-commands:
      - cp -a app /app/encly
      - install -Dm755 encly /app/bin/encly
      - install -Dm644 io.github.pasichdev.Encly.desktop /app/share/applications/io.github.pasichdev.Encly.desktop
      - install -Dm644 io.github.pasichdev.Encly.metainfo.xml /app/share/metainfo/io.github.pasichdev.Encly.metainfo.xml
      - install -Dm644 io.github.pasichdev.Encly.mime.xml /app/share/mime/packages/io.github.pasichdev.Encly.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.pasichdev.Encly.png
    sources:
      # Staged by build.sh: the app image, and a launcher that execs its bin/<name>.
      - type: dir
        path: ../../build/flatpak/app
        dest: app
      - type: file
        path: ../../build/flatpak/encly
      - type: file
        path: io.github.pasichdev.Encly.desktop
      - type: file
        path: io.github.pasichdev.Encly.metainfo.xml
      - type: file
        path: io.github.pasichdev.Encly.mime.xml
      - type: file
        path: ../icons/icon.png
