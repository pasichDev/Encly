name: Release

# Pushing a tag vX.Y.Z releases Encly for Android: both flavors as signed APKs on a GitHub Release with a
# SHA256SUMS. A tag never publishes unsigned APKs: the run fails before building when a signing secret or the
# certificate pin is missing.
#
# The Linux packages of the desktop app (a .deb and a Flatpak bundle) are NOT built by a pushed tag: the desktop app
# is not released yet. The Linux jobs run only on a manual run of this workflow (Actions -> Release -> Run workflow,
# with an existing tag) AND only when the repository variable LINUX_RELEASE_ENABLED is 'true' (it is not set), so a
# stray click cannot put the unreleased desktop app on a Release. To release Linux with every tag again, remove the
# `if:` of linux-deb and linux-flatpak.
#
#   verify-tag     the tag is the version in version.properties and its commit is on main. Every other job needs it.
#   android-build  both flavors, built UNSIGNED by Gradle (which never sees the keystore), signed by a separate step
#                  with apksigner, the certificate checked against the pin. Uploads the files as a workflow artifact.
#   linux-deb      the .deb, built on ubuntu-22.04: jpackage takes the dependencies from the machine it runs on, and
#                  a newer base names libraries "...t64" that older systems do not have (see desktopApp/README.md).
#   linux-flatpak  the Flatpak bundle, built the way the `desktop installer` job of android.yml builds it.
#                  Both upload their file as a workflow artifact; no secrets, read-only token.
#   linux-verify   _verify-linux.yml: clean machines install the .deb (every Ubuntu LTS runner image, Debian 12 and 13)
#                  and the bundle and check the installed files (the GUI is not started). The same file runs on pull requests.
#   github-release holds the write token, the attestation permissions and the optional GPG key; runs no build code.
#                  Creates the Release as a draft, uploads the files, writes ONE SHA256SUMS over all of them (signed as
#                  SHA256SUMS.asc when the GPG secrets exist), attests the build provenance of every file, writes the
#                  notes, and only then publishes the draft.
#
# The Linux files are an addition: when the Linux jobs did not run or did not pass, github-release still runs and
# publishes the Android files alone (see its `if:`). A manual run of this workflow (Actions -> Release -> Run workflow,
# with the tag) runs only the Linux jobs and github-release in "add" mode, and only while the repository variable
# LINUX_RELEASE_ENABLED is 'true': without it the run builds nothing and changes nothing. That run never builds Android
# and never touches Google Play: publish-play.yml is a separate workflow with its own tag trigger and is not changed
# by anything here.
# The Windows MSI and the macOS DMG are never released from here (they are unsigned).
# The Linux packages are not code-signed; they are trusted through SHA256SUMS(.asc) and the attestations.
#
# Gradle builds the APKs UNSIGNED and never sees the keystore; a separate step signs them with
# apksigner using only the signing secrets, then the certificate is checked against the pin.
#
# Repository secrets (required):
#   ENCLY_KEYSTORE_BASE64    base64 of the release keystore (base64 -w0 release.jks)
#   ENCLY_KEYSTORE_PASSWORD  keystore password
#   ENCLY_KEY_ALIAS          key alias
#   ENCLY_KEY_PASSWORD       key password
# Repository secrets (optional):
#   ENCLY_GPG_PRIVATE_KEY    ASCII-armored private key to sign SHA256SUMS
#   ENCLY_GPG_PASSPHRASE     its passphrase
# Repository variable (required):
#   ENCLY_CERT_SHA256        expected SHA-256 of the signing certificate (hex, colons allowed);
#                            an APK signed with any other certificate fails the run.
#
# Third-party actions are pinned by commit SHA (the version is in the comment next to each).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag whose Linux packages are (re)built and added to its Release, e.g. v3.1.0'
        required: true
        type: string

# Every job asks for what it needs.
permissions: {}

# One run per tag at a time, also when the Linux part is re-run by hand while the tag run is still going.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.name }}
    steps:
      # A pushed tag is the tag; a manual run names it. It is checked against a strict pattern before anything
      # uses it, and reaches the shell only through the environment.
      - name: Resolve the tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then tag="$INPUT_TAG"; else tag="$REF_NAME"; fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a release tag vX.Y.Z"
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      # The tag's own code, also when a manual run was started from another ref; the full history, to see main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is the declared version, and its commit is on main
        id: version
        env:
          TAG: ${{ steps.tag.outputs.name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          prop() { grep -E "^$1=" version.properties | cut -d= -f2 | tr -d ' \r'; }
          name="$(prop VERSION_MAJOR).$(prop VERSION_MINOR).$(prop VERSION_PATCH)"
          if [ "v$name" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version.properties (v$name)"
            exit 1
          fi
          # The manual run that adds Linux files builds the tag's own packaging scripts, which exist from 3.1.0 on.
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$(printf '%s\n3.1.0\n' "$name" | sort -V | head -n1)" != 3.1.0 ]; then
            echo "::error::$TAG is older than v3.1.0: it has no Linux packaging and verification scripts, so Linux files cannot be added to its Release."
            exit 1
          fi
          commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::The commit of $TAG ($commit) is not on main. Tag the merge commit on main."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

  android-build:
    # Android only, and only for a pushed tag: a manual run is the Linux re-run.
    if: github.event_name == 'push'
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify-tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build never needs git credentials.
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Signing secrets and certificate pin are set
        env:
          KEYSTORE_BASE64: ${{ secrets.ENCLY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ENCLY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ENCLY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ENCLY_KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.ENCLY_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            if [ -z "${!v}" ]; then echo "::error::ENCLY_$v is not set"; missing=1; fi
          done
          # A release tag must never publish unsigned APKs; fail before the long build.
          exit $missing

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Build and test release APKs (unsigned)
        run: ./gradlew :app:testFdroidDebugUnitTest :app:assembleRelease

      - name: Sign APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.ENCLY_KEYSTORE_BASE64 }}
          ENCLY_KEYSTORE_PASSWORD: ${{ secrets.ENCLY_KEYSTORE_PASSWORD }}
          ENCLY_KEY_ALIAS: ${{ secrets.ENCLY_KEY_ALIAS }}
          ENCLY_KEY_PASSWORD: ${{ secrets.ENCLY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          echo "${KEYSTORE_BASE64}" | base64 -d > "$keystore"
          mkdir -p dist
          for flavor in fdroid play; do
            apk="$(find "app/build/outputs/apk/$flavor/release" -name '*.apk' | head -n1)"
            [ -n "$apk" ] || { echo "::error::No $flavor release APK"; exit 1; }
            # AGP already aligned it (native libraries on 16 KB pages); signing must not move them.
            # Keeping AGP's alignment also keeps the zip byte-identical to an unsigned rebuild, which
            # F-Droid needs to copy our signature onto its own build. minSdk 26 needs no v1 scheme.
            "$tools/zipalign" -c -P 16 4 "$apk"
            "$tools/apksigner" sign \
              --alignment-preserved true --v1-signing-enabled false \
              --ks "$keystore" --ks-pass env:ENCLY_KEYSTORE_PASSWORD \
              --ks-key-alias "$ENCLY_KEY_ALIAS" --key-pass env:ENCLY_KEY_PASSWORD \
              --out "dist/Encly-$VERSION-$flavor.apk" "$apk"
            cp "app/build/outputs/mapping/${flavor}Release/mapping.txt" \
               "dist/Encly-$VERSION-$flavor-mapping.txt"
          done
          rm -f dist/*.idsig
          ls -l dist

      - name: Verify APK signatures against the pinned certificate
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ENCLY_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner"
          expected="$(echo "${EXPECTED_CERT_SHA256}" | tr -d ': ' | tr 'A-F' 'a-f')"
          [ -n "$expected" ] || { echo "::error::ENCLY_CERT_SHA256 is not set"; exit 1; }
          for apk in dist/*.apk; do
            out="$("$apksigner" verify --verbose --print-certs "$apk")"
            echo "$out"
            actual="$(echo "$out" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$apk is signed with $actual, expected $expected"
              exit 1
            fi
          done

      # The keystore is gone from the runner by now; the release job only ever sees these files.
      - name: Upload the signed APKs and mapping files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: dist
          retention-days: 7
          if-no-files-found: error

  # The Linux packages of the desktop app. Independent of android-build: they neither delay nor can fail the Android
  # build. Each is built the way the `desktop installer` jobs of android.yml build it, without signing anything. No
  # secrets and a read-only token: these jobs run the build.
  #
  # The .deb is built on ubuntu-22.04, the oldest supported system: jpackage writes the package's `Depends:` from the
  # machine it runs on, and on Ubuntu 24.04 and later that names `libasound2t64`, `libpng16-16t64`, which Ubuntu 22.04
  # and Debian 12 do not have. The pre-t64 names (`libasound2`, `libpng16-16`) that 22.04 produces are also satisfied
  # by the t64 packages, which `Provides: libasound2 (= version)` (checked in the Ubuntu noble and Debian trixie
  # package indexes). The Flatpak is built on ubuntu-latest, whose flatpak-builder is the newer one.
  linux-deb:
    name: linux .deb
    needs: verify-tag
    # Not on a pushed tag: the desktop app is not released yet (see the top of this file).
    if: github.event_name == 'workflow_dispatch' && vars.LINUX_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-22.04
    # Shorter than the Android build: when Linux is built with a tag again, github-release waits for these jobs (see
    # its `if:`), so a hang here holds the Android release back by at most this long plus linux-verify's.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify-tag.outputs.tag }}
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # jpackage builds the .deb with dpkg-deb and fakeroot.
      - name: Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Package the .deb
        run: ./gradlew :desktopApp:packageDeb

      # jpackage's postinst fails on a machine without a desktop menu directory (a bare window manager); the finished
      # package is patched before anything is uploaded, so the file that is verified is the file that ships.
      # desktopApp/README.md, "The .deb's postinst".
      - name: Patch the .deb's postinst
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(desktopApp/build/compose/binaries/main/deb/*.deb)
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::expected one .deb, found ${#debs[@]}"; exit 1; }
          desktopApp/packaging/deb/harden-postinst.sh --in-place "${debs[0]}"

      - name: Collect the .deb
        run: |
          set -euo pipefail
          mkdir -p linux-dist
          shopt -s nullglob
          debs=(desktopApp/build/compose/binaries/main/deb/*.deb)
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::expected one .deb, found ${#debs[@]}"; exit 1; }
          cp "${debs[0]}" linux-dist/
          ls -l linux-dist

      - name: Upload the .deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-deb
          path: linux-dist
          retention-days: 7
          if-no-files-found: error

  linux-flatpak:
    name: linux flatpak
    needs: verify-tag
    if: github.event_name == 'workflow_dispatch' && vars.LINUX_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify-tag.outputs.tag }}
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # ubuntu-latest restricts unprivileged user namespaces, which bubblewrap (flatpak-builder) needs.
      - name: Flatpak tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils libxml2-utils
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: App image
        run: ./gradlew :desktopApp:createDistributable

      - name: Flatpak
        env:
          ENCLY_FLATPAK_SKIP_GRADLE: '1'
          ENCLY_FLATPAK_REQUIRE_LINT: '1'
        run: desktopApp/packaging/flatpak/build.sh

      - name: Collect the bundle
        run: |
          set -euo pipefail
          mkdir -p linux-dist
          shopt -s nullglob
          flatpaks=(desktopApp/build/flatpak/*.flatpak)
          [ "${#flatpaks[@]}" -eq 1 ] || { echo "::error::expected one .flatpak, found ${#flatpaks[@]}"; exit 1; }
          cp "${flatpaks[0]}" linux-dist/
          ls -l linux-dist

      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-flatpak
          path: linux-dist
          retention-days: 7
          if-no-files-found: error

  # What a user gets, on clean machines that have none of the build (_verify-linux.yml, the same checks as on a pull
  # request): the .deb installed with apt on every Ubuntu LTS runner image and in Debian 12 and 13 containers, the
  # Flatpak bundle installed for the user, then the installed files and the metadata checked. The GUI is not started.
  linux-verify:
    name: linux verify
    needs: [verify-tag, linux-deb, linux-flatpak]
    permissions:
      contents: read
    uses: ./.github/workflows/_verify-linux.yml
    with:
      ref: refs/tags/${{ needs.verify-tag.outputs.tag }}
      deb-artifact: linux-deb
      flatpak-artifact: linux-flatpak

  github-release:
    name: github release
    needs: [verify-tag, android-build, linux-verify]
    # Android is the release: on a pushed tag it must have been built and signed. The Linux files join only when
    # linux-deb, linux-flatpak AND linux-verify passed; if any failed or was skipped, this job still runs and publishes the
    # Android files alone. On a manual run (android-build is skipped by design) the Linux files are all there is,
    # so linux-verify must have passed. Nothing here depends on whether Linux succeeded for a pushed tag.
    if: >-
      ${{ !cancelled()
      && needs.verify-tag.result == 'success'
      && (needs.android-build.result == 'success'
          || (github.event_name == 'workflow_dispatch' && needs.linux-verify.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # sign the attestations
      attestations: write
    env:
      TAG: ${{ needs.verify-tag.outputs.tag }}
      VERSION: ${{ needs.verify-tag.outputs.version }}
      HAS_LINUX: ${{ needs.linux-verify.result == 'success' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify-tag.outputs.tag }}
          persist-credentials: false

      # Each artifact goes into a directory of its own; nothing reaches release-files except through the allow-list
      # below, so a build job cannot publish a file under another job's name (an APK, SHA256SUMS, SHA256SUMS.asc).
      - name: Download the Android files
        if: needs.android-build.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release
          path: incoming/android

      - name: Download the Linux files
        if: needs.linux-verify.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          merge-multiple: true
          path: incoming/linux

      # The files of this release, by name: the APKs and mapping files the Android job writes for this version, and
      # exactly one .deb and one .flatpak of this version. Anything else (another name, a directory, a link, a second
      # file) fails the job, and a name that is already in release-files is a collision.
      - name: Allow-listed files only
        env:
          ANDROID: ${{ needs.android-build.result == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          v="${VERSION//./\\.}"
          take() { # take <dir> <regex>... : every entry of <dir> must be a regular file matching one regex
            local dir="$1" entry name re ok
            shift
            while IFS= read -r -d '' entry; do
              name="$(basename "$entry")"
              [ -f "$entry" ] && [ ! -L "$entry" ] || { echo "::error::$entry is not a regular file"; exit 1; }
              ok=false
              for re in "$@"; do if [[ "$name" =~ $re ]]; then ok=true; fi; done
              [ "$ok" = true ] || { echo "::error::unexpected file $name in $dir"; exit 1; }
              [ ! -e "release-files/$name" ] || { echo "::error::$name is in more than one artifact"; exit 1; }
              cp -- "$entry" "release-files/$name"
            done < <(find "$dir" -mindepth 1 -print0)
          }
          if [ "$ANDROID" = true ]; then
            take incoming/android "^Encly-${v}-(fdroid|play)\.apk$" "^Encly-${v}-(fdroid|play)-mapping\.txt$"
            for f in "Encly-$VERSION-fdroid.apk" "Encly-$VERSION-play.apk" "Encly-$VERSION-fdroid-mapping.txt" "Encly-$VERSION-play-mapping.txt"; do
              [ -f "release-files/$f" ] || { echo "::error::the Android artifact has no $f"; exit 1; }
            done
          fi
          if [ -d incoming/linux ]; then
            take incoming/linux "^encly_${v}-[0-9]+_amd64\.deb$" "^encly-${v}-x86_64\.flatpak$"
            [ "$(find release-files -name '*.deb' | wc -l)" -eq 1 ] || { echo "::error::expected exactly one .deb"; exit 1; }
            [ "$(find release-files -name '*.flatpak' | wc -l)" -eq 1 ] || { echo "::error::expected exactly one .flatpak"; exit 1; }
          fi
          ls -l release-files

      # A push creates the Release; a manual run only adds to the one that is already published.
      - name: The Release state fits this run
        id: state
        run: |
          set -euo pipefail
          # Read into a variable first (no pipeline into grep -q: with several pages gh may still be writing when grep
          # exits, and the pipeline would end with 141 under pipefail).
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | .draft')"
          if [ -n "$draft" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$draft" = false ] || { echo "::error::$TAG has no published GitHub Release. A manual run only adds the Linux files to the Release the tag run published."; exit 1; }
            echo "mode=add" >> "$GITHUB_OUTPUT"
          else
            [ "$draft" != false ] || { echo "::error::$TAG already has a published Release. To add the Linux files to it, run this workflow by hand with the tag."; exit 1; }
            echo "mode=new" >> "$GITHUB_OUTPUT"
          fi

      # Signing goes through Sigstore (Fulcio, Rekor); a network timeout there fails the step, so the attestation
      # gets a second try. Every file this run releases is a subject.
      - name: Attest the build provenance
        id: attest
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/release-files/*
      - name: Attest the build provenance (retry)
        id: attest-retry
        if: steps.attest.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/release-files/*

      # One SHA256SUMS over every file of the Release. A manual run starts from the published one (checked against
      # its signature first), replaces the names it re-releases, and adds the new lines. Nothing is uploaded until
      # the new file is complete and signed, so a SHA256SUMS never sits next to a stale .asc.
      - name: SHA256SUMS (and its signature)
        env:
          MODE: ${{ steps.state.outputs.mode }}
          GPG_PRIVATE_KEY: ${{ secrets.ENCLY_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.ENCLY_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          have_asc=false
          if [ "$MODE" = add ]; then
            mkdir -p old
            gh release download "$TAG" --dir old --pattern SHA256SUMS
            asset_names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            if grep -qx 'SHA256SUMS.asc' <<< "$asset_names"; then
              have_asc=true
              gh release download "$TAG" --dir old --pattern SHA256SUMS.asc
            fi
          fi

          if [ -n "$GPG_PRIVATE_KEY" ]; then
            export GNUPGHOME="$RUNNER_TEMP/gnupg"
            mkdir -p "$GNUPGHOME"
            chmod 700 "$GNUPGHOME"
            trap 'rm -rf "$GNUPGHOME"' EXIT
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            if [ "$have_asc" = true ]; then
              gpg --batch --verify old/SHA256SUMS.asc old/SHA256SUMS
            fi
          elif [ "$have_asc" = true ]; then
            echo "::error::The Release has SHA256SUMS.asc but ENCLY_GPG_PRIVATE_KEY is not set: SHA256SUMS cannot be signed again, so it is left as it is and nothing is added."
            exit 1
          else
            echo "No GPG key configured; SHA256SUMS is published unsigned."
          fi

          cd release-files
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum -- > ../new.sums
          [ -s ../new.sums ] || { echo "::error::no file to release"; exit 1; }
          if [ "$MODE" = add ]; then
            # Old lines first (minus any with a re-released name), then the new lines.
            awk 'NR == FNR { drop[$2] = 1; next } !($2 in drop)' ../new.sums ../old/SHA256SUMS > SHA256SUMS
            cat ../new.sums >> SHA256SUMS
          else
            cp ../new.sums SHA256SUMS
          fi
          cat SHA256SUMS

          if [ -n "$GPG_PRIVATE_KEY" ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
            gpg --batch --verify SHA256SUMS.asc SHA256SUMS
          fi

      - name: Release notes
        env:
          MODE: ${{ steps.state.outputs.mode }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url || steps.attest-retry.outputs.attestation-url }}
        run: |
          set -euo pipefail
          {
            echo "### Linux packages"
            echo
            echo 'The `.deb` and the `.flatpak` bundle are not code-signed; their checksums are in `SHA256SUMS`'
            echo '(signed as `SHA256SUMS.asc` when that file is present) and each package has an attested build provenance.'
            echo 'Install with `sudo apt install ./encly_*.deb` or `flatpak install --user ./encly-*.flatpak`.'
          } > linux-notes.md

          if [ "$MODE" = add ]; then
            body="$(gh release view "$TAG" --json body --jq .body)"
            if ! grep -q '^### Linux packages' <<< "$body"; then
              { printf '%s\n\n' "$body"; cat linux-notes.md; } > notes.md
              echo "append=true" > notes.state
            else
              echo "append=false" > notes.state
            fi
            exit 0
          fi

          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]"
            exit 1
          fi
          if [ "$HAS_LINUX" = true ]; then { echo; cat linux-notes.md; } >> notes.md; fi
          {
            echo
            echo "### Verify what you download"
            echo
            echo 'Download `SHA256SUMS` next to the files and run `sha256sum --check --ignore-missing SHA256SUMS`.'
            echo 'When `SHA256SUMS.asc` is present it is the GPG signature of that file.'
            echo
            if [ "$HAS_LINUX" = true ]; then subjects='APK, mapping file and Linux package'; else subjects='APK and mapping file'; fi
            echo "Every $subjects of this release has an attested build provenance"
            echo '(`SHA256SUMS` is covered by its GPG signature `SHA256SUMS.asc`, not by an attestation):'
            echo
            echo '```'
            echo "gh attestation verify <file> --repo $GITHUB_REPOSITORY"
            echo '```'
            if [ -n "$ATTESTATION_URL" ]; then
              echo
              echo "Attestation: $ATTESTATION_URL"
            fi
            echo
            echo 'APKs: check the signer with `apksigner verify --print-certs <apk>` against the certificate'
            echo 'fingerprint published in the [README](https://github.com/'"$GITHUB_REPOSITORY"'#verify-a-release).'
          } >> notes.md
          cat notes.md

      # A push: the Release is created as a draft, gets every file, and becomes visible only in the last step, so a
      # failure on the way leaves a draft and no half-published release. A manual run uploads into the published one.
      - name: Create the draft, or add to the published Release
        env:
          MODE: ${{ steps.state.outputs.mode }}
          EXISTS: ${{ steps.state.outputs.exists }}
        run: |
          set -euo pipefail
          if [ "$MODE" = new ]; then
            if [ "$EXISTS" = true ]; then
              # A draft left by an earlier failed attempt of this tag: nothing in it is public. Every asset is
              # removed first, so no file of that attempt (a Linux package, an old SHA256SUMS.asc) survives into this one.
              old_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
              while IFS= read -r name; do
                [ -z "$name" ] || gh release delete-asset "$TAG" "$name" --yes
              done <<< "$old_assets"
              gh release edit "$TAG" --notes-file notes.md
            else
              gh release create "$TAG" --draft --title "Encly $VERSION" --notes-file notes.md --verify-tag
            fi
          fi
          # One call, with SHA256SUMS and its signature in it.
          gh release upload "$TAG" --clobber -- release-files/*
          if [ "$MODE" = add ] && [ "$(cat notes.state)" = append=true ]; then
            gh release edit "$TAG" --notes-file notes.md
          fi

      # Last step: only here, with everything uploaded, the Release becomes visible.
      - name: Publish the release
        if: steps.state.outputs.mode == 'new'
        run: gh release edit "$TAG" --draft=false --latest
