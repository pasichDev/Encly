name: Release

# Pushing a tag vX.Y.Z builds both distribution flavors, signs them, and publishes a GitHub
# Release with the APKs, SHA256SUMS and R8 mappings. A tag never publishes unsigned APKs: the run
# fails before building when a signing secret or the certificate pin is missing.
#
# Gradle builds the APKs UNSIGNED and never sees the keystore; a separate step signs them with
# apksigner using only the signing secrets, then the certificate is checked against the pin.
#
# Repository secrets (required):
#   ENCLY_KEYSTORE_BASE64    base64 of the release keystore (base64 -w0 release.jks)
#   ENCLY_KEYSTORE_PASSWORD  keystore password
#   ENCLY_KEY_ALIAS          key alias
#   ENCLY_KEY_PASSWORD       key password
# Repository secrets (optional):
#   ENCLY_GPG_PRIVATE_KEY    ASCII-armored private key to sign SHA256SUMS
#   ENCLY_GPG_PASSPHRASE     its passphrase
# Repository variable (required):
#   ENCLY_CERT_SHA256        expected SHA-256 of the signing certificate (hex, colons allowed);
#                            an APK signed with any other certificate fails the run.
#
# Third-party actions are pinned by commit SHA (the version is in the comment next to each).

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Tag must match version.properties
        id: version
        run: |
          set -euo pipefail
          prop() { grep -E "^$1=" version.properties | cut -d= -f2 | tr -d ' \r'; }
          name="$(prop VERSION_MAJOR).$(prop VERSION_MINOR).$(prop VERSION_PATCH)"
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.properties (v$name)"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Signing secrets and certificate pin are set
        env:
          KEYSTORE_BASE64: ${{ secrets.ENCLY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ENCLY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ENCLY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ENCLY_KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.ENCLY_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            if [ -z "${!v}" ]; then echo "::error::ENCLY_$v is not set"; missing=1; fi
          done
          # A release tag must never publish unsigned APKs; fail before the long build.
          exit $missing

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: true

      - name: Build and test release APKs (unsigned)
        run: ./gradlew :app:testFdroidDebugUnitTest assembleRelease

      - name: Sign APKs
        env:
          VERSION: ${{ steps.version.outputs.name }}
          KEYSTORE_BASE64: ${{ secrets.ENCLY_KEYSTORE_BASE64 }}
          ENCLY_KEYSTORE_PASSWORD: ${{ secrets.ENCLY_KEYSTORE_PASSWORD }}
          ENCLY_KEY_ALIAS: ${{ secrets.ENCLY_KEY_ALIAS }}
          ENCLY_KEY_PASSWORD: ${{ secrets.ENCLY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          echo "${KEYSTORE_BASE64}" | base64 -d > "$keystore"
          mkdir -p dist
          for flavor in fdroid play; do
            apk="$(find "app/build/outputs/apk/$flavor/release" -name '*.apk' | head -n1)"
            [ -n "$apk" ] || { echo "::error::No $flavor release APK"; exit 1; }
            # AGP already aligned it (native libraries on 16 KB pages); signing must not move them.
            "$tools/zipalign" -c -P 16 4 "$apk"
            "$tools/apksigner" sign \
              --ks "$keystore" --ks-pass env:ENCLY_KEYSTORE_PASSWORD \
              --ks-key-alias "$ENCLY_KEY_ALIAS" --key-pass env:ENCLY_KEY_PASSWORD \
              --out "dist/Encly-$VERSION-$flavor.apk" "$apk"
            cp "app/build/outputs/mapping/${flavor}Release/mapping.txt" \
               "dist/Encly-$VERSION-$flavor-mapping.txt"
          done
          rm -f dist/*.idsig
          ls -l dist

      - name: Verify APK signatures against the pinned certificate
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ENCLY_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner"
          expected="$(echo "${EXPECTED_CERT_SHA256}" | tr -d ': ' | tr 'A-F' 'a-f')"
          [ -n "$expected" ] || { echo "::error::ENCLY_CERT_SHA256 is not set"; exit 1; }
          for apk in dist/*.apk; do
            out="$("$apksigner" verify --verbose --print-certs "$apk")"
            echo "$out"
            actual="$(echo "$out" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$apk is signed with $actual, expected $expected"
              exit 1
            fi
          done

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.apk *.txt > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS (optional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.ENCLY_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.ENCLY_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "No GPG key configured; SHA256SUMS is published unsigned."
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE}" \
            --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          rm -rf "$GNUPGHOME"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/NOTES.md
          if [ ! -s dist/NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]"
            exit 1
          fi
          {
            echo
            echo "### Verify"
            echo
            echo 'Download `SHA256SUMS` next to the APK and run `sha256sum -c --ignore-missing SHA256SUMS`.'
            echo 'Check the signer with `apksigner verify --print-certs <apk>` against the certificate'
            echo 'fingerprint published in the README.'
          } >> dist/NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Encly ${{ steps.version.outputs.name }}
          body_path: dist/NOTES.md
          fail_on_unmatched_files: false
          files: |
            dist/*.apk
            dist/*-mapping.txt
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
