# Single source of truth for the app version.
# versionName is built as "MAJOR.MINOR.PATCH".
# versionCode is derived deterministically as MAJOR*10000 + MINOR*100 + PATCH,
# so bumping the semver below automatically produces a higher, monotonic code.
# (v1 on main shipped versionName 1.1.1 with manual codes up to 30; 2.0.0 -> 20000.)
#
# Release tags must be "v" + versionName (e.g. v2.0.0); .github/workflows/release.yml
# refuses a tag that does not match this file. See CONTRIBUTING.md > Releasing.
VERSION_MAJOR=2
VERSION_MINOR=0
VERSION_PATCH=1
