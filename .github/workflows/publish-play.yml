name: Publish to Google Play

# Uploads the signed `play` bundle of a release tag to the Google Play INTERNAL track.
#
# DISABLED BY DEFAULT. It never runs on push, pull request or tag events: it can only be started
# by hand (Actions -> "Publish to Google Play" -> Run workflow), and even then every job is
# skipped unless the repository VARIABLE PLAY_PUBLISH_ENABLED is exactly 'true'.
# To enable it: add the secrets below, then set the repository variable PLAY_PUBLISH_ENABLED=true.
#
# Repository secrets (all required once enabled):
#   PLAY_SERVICE_ACCOUNT_JSON  JSON key of a Play Console service account limited to this app
#   ENCLY_KEYSTORE_BASE64      base64 of the release (upload) keystore
#   ENCLY_KEYSTORE_PASSWORD    keystore password
#   ENCLY_KEY_ALIAS            key alias
#   ENCLY_KEY_PASSWORD         key password

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag to publish (vX.Y.Z, must match version.properties)'
        required: true
        type: string
      status:
        description: 'Release status on the internal track (draft until the app passed its first review)'
        required: true
        default: draft
        type: choice
        options: [ draft, completed ]

permissions:
  contents: read

concurrency:
  group: publish-play
  cancel-in-progress: false

jobs:
  publish:
    if: vars.PLAY_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Only release tags
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ref must be a release tag vX.Y.Z, got '$REF'"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.ref }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Tag must match version.properties
        id: version
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          prop() { grep -E "^$1=" version.properties | cut -d= -f2 | tr -d ' \r'; }
          major="$(prop VERSION_MAJOR)"; minor="$(prop VERSION_MINOR)"; patch="$(prop VERSION_PATCH)"
          name="$major.$minor.$patch"
          if [ "v$name" != "$REF" ]; then
            echo "::error::Tag $REF does not match version.properties (v$name)"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Required secrets are set
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE_BASE64: ${{ secrets.ENCLY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ENCLY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ENCLY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ENCLY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for v in PLAY_JSON KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is not set"; missing=1; fi
          done
          # Play rejects unsigned bundles; fail here instead of after a long build.
          exit $missing

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ENCLY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "${KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ENCLY_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build the play bundle
        env:
          ENCLY_KEYSTORE_PASSWORD: ${{ secrets.ENCLY_KEYSTORE_PASSWORD }}
          ENCLY_KEY_ALIAS: ${{ secrets.ENCLY_KEY_ALIAS }}
          ENCLY_KEY_PASSWORD: ${{ secrets.ENCLY_KEY_PASSWORD }}
        run: ./gradlew :app:testPlayReleaseUnitTest :app:bundlePlayRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify bundle signature
        run: |
          set -euo pipefail
          aab=app/build/outputs/bundle/playRelease/app-play-release.aab
          test -f "$aab"
          jarsigner -verify "$aab" | tee /dev/stderr | grep -q 'jar verified'

      - name: Release notes from fastlane changelogs
        env:
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          mkdir -p whatsnew
          for dir in fastlane/metadata/android/*/; do
            locale="$(basename "$dir")"
            notes="$dir/changelogs/$CODE.txt"
            [ -f "$notes" ] && cp "$notes" "whatsnew/whatsnew-$locale"
          done
          test -f whatsnew/whatsnew-en-US || { echo "::error::no en-US changelog for $CODE"; exit 1; }
          ls whatsnew

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pasich.encly
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          releaseName: ${{ steps.version.outputs.name }}
          track: internal
          status: ${{ inputs.status }}
          mappingFile: app/build/outputs/mapping/playRelease/mapping.txt
          whatsNewDirectory: whatsnew
