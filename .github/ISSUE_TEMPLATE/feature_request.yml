name: Feature request
description: Suggest an improvement for Encly.
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        Encly is offline-only by design: no network permission, no account, no sync, no
        analytics. Requests that need any of these will be declined.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security / privacy impact
      description: Does this expose plaintext outside the encrypted vault (clipboard, share, notifications, files)?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
