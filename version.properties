# Single source of truth for the app version.
# versionName is built as "MAJOR.MINOR.PATCH".
# versionCode is derived deterministically as MAJOR*10000 + MINOR*100 + PATCH,
# so bumping the semver below automatically produces a higher, monotonic code.
# (1.1.1 -> 10101; previous manual codes went up to 30, so this stays increasing.)
VERSION_MAJOR=1
VERSION_MINOR=1
VERSION_PATCH=1
